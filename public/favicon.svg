<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <title>Emmy.js</title>
  <style>
    /* Drawn as rectangles rather than text so it doesn't depend on a font
       being installed, and stays crisp at 16px. */
    .bg { fill: #000000; }
    .fg { fill: #ffffff; }

    /* Invert on dark browser chrome, where a black tile would disappear
       into the tab strip. */
    @media (prefers-color-scheme: dark) {
      .bg { fill: #ffffff; }
      .fg { fill: #000000; }
    }
  </style>

  <rect class="bg" width="100" height="100" rx="22" />

  <!-- E -->
  <rect class="fg" x="26" y="25" width="13" height="50" />
  <rect class="fg" x="26" y="25" width="36" height="13" />
  <rect class="fg" x="26" y="43.5" width="28" height="13" />
  <rect class="fg" x="26" y="62" width="36" height="13" />

  <!-- the dot from .js -->
  <circle class="fg" cx="71" cy="68.5" r="6.5" />
</svg>
